<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP Paint - Hero Section</title>
    <!-- นำเข้าฟอนต์เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #111;
        }

        .scroll-track {
            height: 250vh; 
            position: relative;
        }

        .hero-sticky {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        .hero-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center; 
        }

        #layer-base {
            z-index: 1;
        }

        #layer-reveal {
            z-index: 2;
            clip-path: inset(0 0 100% 0);
            will-change: clip-path;
        }

        .overlay-content {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            color: white;
            z-index: 10;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .overlay-content h1 {
            font-size: clamp(3rem, 5vw, 6rem);
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .overlay-content p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.9;
        }

        .next-section {
            height: 100vh;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .next-section h2 {
            font-size: 3rem;
        }
    </style>
</head>
<body>

    <div class="scroll-track" id="scrollTrack">
        <div class="hero-sticky">
            
            <!-- เริ่มต้น: เลเยอร์ฐานสีแดง -->
            <img src="_h1_red.png" class="hero-img" id="layer-base" alt="Base House">
            
            <!-- เริ่มต้น: เลเยอร์เติมสีเหลือง -->
            <img src="_h1_yellow.png" class="hero-img" id="layer-reveal" alt="Reveal House">

            <div class="overlay-content">
                <h1>LIVE IN<br>COLORS</h1>
                <p>เลื่อนลงเพื่อสัมผัสประสบการณ์การเปลี่ยนสี</p>
            </div>
        </div>
    </div>

    <div class="next-section">
        <h2>เนื้อหาเวปไซต์ส่วนถัดไป...</h2>
    </div>

    <script>
        const scrollTrack = document.getElementById('scrollTrack');
        const layerBase = document.getElementById('layer-base');
        const layerReveal = document.getElementById('layer-reveal');

        // สีทั้งหมดในระบบ
        const allColors = [
            "_h1_Blue.png",
            "_h1_orange.png",
            "_h1_red.png",
            "_h1_sky.png",
            "_h1_white.png",
            "_h1_yellow.png"
        ];

        // "กองการ์ดสี" สำหรับสุ่ม (เอาแดงกับเหลืองออกก่อนในรอบแรก เพื่อบังคับให้เจอสีอื่นแน่นอน)
        let colorDeck = [
            "_h1_Blue.png",
            "_h1_orange.png",
            "_h1_sky.png",
            "_h1_white.png"
        ];

        // ฟังก์ชันสับไพ่ (สลับตำแหน่งสีใน Array ให้ไม่ซ้ำแพทเทิร์นเดิม)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        // สับไพ่สีรอบแรกเตรียมไว้
        shuffle(colorDeck);

        // ฟังก์ชันดึงสีใหม่
        function getNextColor(currentVisibleColor) {
            // ถ้าสีในกองหมดแล้ว ให้หยิบสีทั้งหมดมาสับใหม่
            if (colorDeck.length === 0) {
                // เอาทุกสียกเว้น "สีที่กำลังโชว์อยู่บนจอตอนนี้" เพื่อกันการเปลี่ยนแล้วได้สีเดิม
                colorDeck = allColors.filter(c => c !== currentVisibleColor);
                shuffle(colorDeck);
            }
            // ดึงสีใบบนสุดออกไปใช้
            return colorDeck.pop();
        }

        let isAtTop = true;
        let isAtBottom = false;

        window.addEventListener('scroll', () => {
            const trackRect = scrollTrack.getBoundingClientRect();
            const maxScrollableHeight = trackRect.height - window.innerHeight;
            
            let scrollProgress = 0;
            if (trackRect.top < 0) {
                scrollProgress = Math.abs(trackRect.top) / maxScrollableHeight;
            }

            // ปัดเศษให้ชัวร์ว่าลงสุดหรือขึ้นสุด
            if (scrollProgress < 0.05) scrollProgress = 0;
            if (scrollProgress > 0.95) scrollProgress = 1;

            // ค่อยๆ เปิด/ปิด เลเยอร์หน้า
            const insetBottom = 100 - (scrollProgress * 100);
            layerReveal.style.clipPath = `inset(0 0 ${insetBottom}% 0)`;

            // --- ตรรกะเตรียมสลับคู่สี ---
            if (scrollProgress === 1) {
                // เมื่อเลื่อนลงมาสุดทาง
                if (!isAtBottom) {
                    isAtBottom = true;
                    // ดึงสีที่กำลังโชว์เต็มๆ ตอนนี้ (layerReveal) ไปเป็นข้อแม้ไม่ให้สุ่มได้สีเดิม
                    const currentVisible = layerReveal.getAttribute('src');
                    // แอบเปลี่ยนเลเยอร์หลังรอไว้เลย พอเลื่อนกลับขึ้นไปจะได้เจอสีใหม่!
                    layerBase.src = getNextColor(currentVisible);
                }
            } else if (scrollProgress === 0) {
                // เมื่อเลื่อนกลับขึ้นไปบนสุด
                if (!isAtTop) {
                    isAtTop = true;
                    // ดึงสีที่กำลังโชว์เต็มๆ ตอนนี้ (layerBase)
                    const currentVisible = layerBase.getAttribute('src');
                    // แอบเปลี่ยนเลเยอร์หน้ารอไว้ พอเลื่อนลงครั้งต่อไปจะได้เจอสีใหม่!
                    layerReveal.src = getNextColor(currentVisible);
                }
            } else {
                // รีเซ็ตสถานะตอนอยู่ระหว่างทาง
                isAtTop = false;
                isAtBottom = false;
            }
        });
    </script>
</body>
</html>
