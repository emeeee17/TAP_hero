<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Random Color House</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111; /* พื้นหลังหน้าเว็บ */
        }

        /* Section แรก (พื้นที่สำหรับเลื่อนเติมสีบ้าน) */
        .hero {
            height: 150vh; /* ความยาวของการเลื่อน */
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            background-color: #f8f9fa;
        }

        /* กล่องที่จะเกาะติดหน้าจอ (Sticky) เวลาเราเลื่อนลง */
        .sticky-container {
            position: sticky;
            top: 25vh; /* ระยะห่างจากขอบบน */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        /* รูปร่างบ้าน */
        .house-wrapper {
            width: 200px;
            height: 200px;
            background-color: #ddd; /* สีของบ้านตอนที่ยังไม่มีสีเติม (สีเทา) */
            /* ใช้ Clip-path ตัด Div ให้เป็นรูปทรงบ้าน */
            clip-path: polygon(50% 0%, 100% 40%, 100% 100%, 0 100%, 0 40%);
            position: relative;
        }

        /* สีที่จะถูกเติมขึ้นมาเรื่อยๆ ตามการเลื่อน */
        .house-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; /* JS จะเป็นตัวควบคุมตรงนี้ */
            background-color: #FF8C00; /* สีเริ่มต้น (จะถูกเขียนทับด้วย JS) */
            transition: background-color 0.5s ease-in-out; /* ทำให้ตอนเปลี่ยนสีดูนุ่มนวล */
        }

        /* Section ถัดไป หลังจากผ่านช่วงเติมสีบ้าน */
        .content {
            height: 100vh;
            background-color: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- ส่วน Hero: ควบคุมการเติมสีบ้าน -->
    <div class="hero" id="hero">
        <div class="sticky-container">
            <h1>เลื่อนลงเพื่อเติมสีบ้าน</h1>
            <div class="house-wrapper">
                <div class="house-fill" id="houseFill"></div>
            </div>
        </div>
    </div>

    <!-- ส่วนเนื้อหาด้านล่าง -->
    <div class="content" id="content">
        <h2>พ้น Section Hero แล้ว!</h2>
        <p style="color: #aaa;">ลองเลื่อนกลับขึ้นไปดูสิ บ้านจะเปลี่ยนเป็นสีใหม่ทันที</p>
    </div>

    <script>
        const houseFill = document.getElementById('houseFill');
        const hero = document.getElementById('hero');

        // 1. ชุดสีที่ต้องการ (ใส่ส้ม กับ skyblue มาให้แล้วตามคำขอ)
        const colors = [
            '#FF8C00', // ส้ม (Orange)
            '#87CEEB', // ฟ้า (Skyblue)
            '#FF3366', // ชมพู
            '#2ECC71', // เขียว
            '#9B59B6', // ม่วง
            '#F1C40F'  // เหลือง
        ];

        let currentColor = ''; // เก็บค่าปัจจุบันเพื่อกันไม่ให้สุ่มได้สีเดิมซ้ำ
        let wasPastHero = false;
        let wasAtTop = true;

        // ฟังก์ชันสุ่มสี (จะไม่สุ่มได้สีเดิมที่กำลังแสดงอยู่)
        function setRandomColor() {
            let availableColors = colors.filter(c => c !== currentColor);
            currentColor = availableColors[Math.floor(Math.random() * availableColors.length)];
            houseFill.style.backgroundColor = currentColor;
        }

        // เซ็ตสีเริ่มต้นทันทีที่โหลดหน้าเว็บ
        setRandomColor();

        window.addEventListener('scroll', () => {
            let scrollY = window.scrollY;

            // คำนวณระยะการเลื่อนที่จะให้สีเต็มพอดี
            let scrollRange = hero.offsetHeight - window.innerHeight;
            if (scrollRange < 100) scrollRange = hero.offsetHeight * 0.8;

            // คำนวณ % การเลื่อน (ได้ค่า 0 ถึง 1)
            let progress = scrollY / scrollRange;

            // บังคับค่าให้อยู่ในช่วง 0 ถึง 1 เสมอ (แก้ปัญหาสีค้าง และคำนวณพลาด)
            if (progress < 0) progress = 0;
            if (progress > 1) progress = 1;

            // สั่งเติมสีตาม % (แก้ปัญหาสีไม่เต็ม 100% ตอนเลื่อนไม่สุด เพราะตัวนี้มันซิงค์กับ Scroll แบบเป๊ะๆ)
            houseFill.style.height = (progress * 100) + '%';

            // เช็คสถานะปัจจุบัน
            let isPastHero = progress >= 1; 
            let isAtTop = scrollY <= 30; // ใช้ระยะเผื่อ 30px (แก้ปัญหาเลื่อนกลับขึ้นบนสุดแล้วไม่แรงพอ)

            // ----------------------------------------------------
            // ทริกเกอร์ 1: ตอนพ้น Section Hero ไปแล้ว และ "เลื่อนกลับขึ้นมา"
            // ให้สุ่มสีใหม่ 100% ทันทีตามที่ขอ
            // ----------------------------------------------------
            if (wasPastHero && !isPastHero) {
                setRandomColor();
            }

            // ----------------------------------------------------
            // ทริกเกอร์ 2: เลื่อนกลับมาถึงบนสุด (เผื่อระยะไว้แล้ว)
            // รีเซ็ตเพื่อเตรียมสีใหม่เผื่อเคสที่เลื่อนลงไม่สุดแล้วตีกลับขึ้นบนสุด
            // ----------------------------------------------------
            if (!wasAtTop && isAtTop) {
                setRandomColor();
            }

            // อัปเดตสถานะสำหรับรอบถัดไป
            wasPastHero = isPastHero;
            wasAtTop = isAtTop;
        });
    </script>
</body>
</html>
