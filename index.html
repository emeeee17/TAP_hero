<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP Paint - Hero Section (Deep Zoom Mobile Optimized)</title>
    <!-- นำเข้าฟอนต์เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #111;
        }

        .scroll-track {
            height: 250vh; 
            position: relative;
        }

        .hero-sticky {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        /* --- แก้ไข CSS ส่วนนี้ --- */
        .hero-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ปรับเป็น top center เพื่อให้ตอนหมุนจอภาพหรือจอใหญ่ไม่ดูแปลก (optional) */
            object-position: top center; 
            /* ใส่ Transition เล็กน้อยเพื่อให้ดูนุ่มนวลเวลาเปลี่ยนขนาดจอ */
            transition: transform 0.3s ease, object-position 0.3s ease, width 0.3s ease, height 0.3s ease;
        }

        /* --- แก้ไข Media Query สำหรับมือถือ (Deep Zoom) --- */
        @media (max-width: 768px) {
            .hero-img {
                /* 1. บังคับซูมเน้น: ทำให้ภาพกว้างเป็น 3 เท่าของหน้าจอ */
                width: 300% !important; 
                height: auto !important; /* ปล่อยความสูงให้เป็น auto เพื่อคงสัดส่วนภาพ */
                
                max-width: none !important; /* ปลดล็อก max-width */

                /* 2. จัดตำแหน่งเน้น ซ้ายบน: ดึงขอบซ้ายและขอบบนของภาพบ้านมาชนขอบหน้าจอเสมอ */
                object-position: top left;

                /* --- (แนะนำ) ปรับแต่งแนวตั้งเพื่อให้เห็นบรรไดนิดเดียว --- */
                /* หากซูมเยอะมากจนบรรไดหายไปเลย ให้เอาคอมเมนต์หน้า translateX ออก 
                   แล้วปรับตัวเลข (ค่าบวกขยับรูปขึ้น ค่าลบขยับรูปลง) */
                /* transform: translateY(-3%); */ /* ตัวอย่าง: ขยับรูปลงมาเล็กน้อยเพื่อให้เห็นบรรได */
            }
            
            /* ปรับขนาดเนื้อหา Overlay ให้เล็กคอมือถือด้วย */
            .overlay-content {
                left: 5%;
                width: 90%;
            }
        }
        /* ----------------------- */

        #layer-base {
            z-index: 1;
        }

        #layer-reveal {
            z-index: 2;
            clip-path: inset(0 0 100% 0);
            will-change: clip-path;
        }

        .overlay-content {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            color: white;
            z-index: 10;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .overlay-content h1 {
            font-size: clamp(2.5rem, 8vw, 6rem); /* ปรับ min clamp ให้เล็กคอมือถือ */
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .overlay-content p {
            font-size: clamp(0.9rem, 4vw, 1.5rem); /* ปรับ min clamp ให้เล็กคอมือถือ */
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.9;
        }

        .next-section {
            height: 100vh;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .next-section h2 {
            font-size: 2rem; /* ปรับขนาดพาดหัวเซกชันถัดไปให้เล็กคอมือถือ */
            padding: 0 20px;
            text-align: center;
        }
        @media (min-width: 769px) {
             .next-section h2 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="scroll-track" id="scrollTrack">
        <div class="hero-sticky">
            
            <!-- เลเยอร์รูปภาพจะถูกปรับตาม CSS media query ด้านบน -->
            <!-- เริ่มต้น: เลเยอร์ฐานสีแดง -->
            <img src="_h1_red.png" class="hero-img" id="layer-base" alt="Base House">
            
            <!-- เริ่มต้น: เลเยอร์เติมสีเหลือง -->
            <img src="_h1_yellow.png" class="hero-img" id="layer-reveal" alt="Reveal House">

            <div class="overlay-content">
                <h1>LIVE IN<br>COLORS</h1>
                <p>เลื่อนลงเพื่อสัมผัสประสบการณ์การเปลี่ยนสี</p>
            </div>
        </div>
    </div>

    <div class="next-section">
        <h2>เนื้อหาเวปไซต์ส่วนถัดไป...</h2>
    </div>

    <script>
        // โค้ด JavaScript เดิมของคุณ ทำงานได้ดีอยู่แล้ว ไม่ต้องแก้ไขครับ
        const scrollTrack = document.getElementById('scrollTrack');
        const layerBase = document.getElementById('layer-base');
        const layerReveal = document.getElementById('layer-reveal');

        const allColors = [
            "_h1_Blue.png",
            "_h1_orange.png",
            "_h1_red.png",
            "_h1_sky.png",
            "_h1_white.png",
            "_h1_yellow.png"
        ];

        let colorDeck = [
            "_h1_Blue.png",
            "_h1_orange.png",
            "_h1_sky.png",
            "_h1_white.png"
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        shuffle(colorDeck);

        function getNextColor(currentVisibleColor) {
            if (colorDeck.length === 0) {
                colorDeck = allColors.filter(c => c !== currentVisibleColor);
                shuffle(colorDeck);
            }
            return colorDeck.pop();
        }

        let isAtTop = true;
        let isAtBottom = false;

        window.addEventListener('scroll', () => {
            const trackRect = scrollTrack.getBoundingClientRect();
            const maxScrollableHeight = trackRect.height - window.innerHeight;
            
            let scrollProgress = 0;
            if (trackRect.top < 0) {
                scrollProgress = Math.abs(trackRect.top) / maxScrollableHeight;
            }

            if (scrollProgress < 0.005) scrollProgress = 0;
            if (scrollProgress > 0.995) scrollProgress = 1;

            const insetBottom = 100 - (scrollProgress * 100);
            layerReveal.style.clipPath = `inset(0 0 ${insetBottom}% 0)`;

            if (scrollProgress === 1) {
                if (!isAtBottom) {
                    isAtBottom = true;
                    const currentVisible = layerReveal.getAttribute('src');
                    layerBase.src = getNextColor(currentVisible);
                }
            } else if (scrollProgress === 0) {
                if (!isAtTop) {
                    isAtTop = true;
                    const currentVisible = layerBase.getAttribute('src');
                    layerReveal.src = getNextColor(currentVisible);
                }
            } else {
                isAtTop = false;
                isAtBottom = false;
            }
        });
    </script>
</body>
</html>
