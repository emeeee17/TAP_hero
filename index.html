<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP Paint - Hero Section</title>
    <!-- นำเข้าฟอนต์เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #111;
        }

        /* พื้นที่สำหรับ Scroll ให้มีระยะเลื่อน */
        .scroll-track {
            height: 250vh; /* ความยาวของการ Scroll เพื่อให้มีเวลาดูการเปลี่ยนสี */
            position: relative;
        }

        /* Section Hero ที่จะล็อคติดหน้าจอขณะเลื่อน */
        .hero-sticky {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh; /* สูงเต็มจอ */
            overflow: hidden;
            background-color: #000;
        }

        /* จัดการรูปภาพให้อยู่ตรงกลาง ครอปส่วนล่าง (บรรได) ทิ้งถ้าจอกว้าง */
        .hero-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center; 
        }

        /* เลเยอร์สีฐาน (สีแดง) */
        #layer-base {
            z-index: 1;
        }

        /* เลเยอร์สีใหม่ที่จะค่อยๆ โผล่มา */
        #layer-reveal {
            z-index: 2;
            clip-path: inset(0 0 100% 0); /* ซ่อนรูปจากด้านล่าง 100% (มองไม่เห็นตอนแรก) */
            will-change: clip-path; /* เพิ่มประสิทธิภาพการเรนเดอร์ */
        }

        /* ข้อความทับบนรูป */
        .overlay-content {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            color: white;
            z-index: 10;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .overlay-content h1 {
            font-size: clamp(3rem, 5vw, 6rem);
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .overlay-content p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* Section เนื้อหาถัดไปของเว็บไซต์ */
        .next-section {
            height: 100vh;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .next-section h2 {
            font-size: 3rem;
        }
    </style>
</head>
<body>

    <!-- Scroll Track Container -->
    <div class="scroll-track" id="scrollTrack">
        <div class="hero-sticky">
            
            <!-- Default Image (Red) -->
            <img src="https://drive.google.com/uc?export=view&id=1TFPGw1zYqqjKS6oT6D7CWJopW3WTiCh4" class="hero-img" id="layer-base" alt="Red House">
            
            <!-- Dynamic Reveal Image (Random Color) -->
            <img src="" class="hero-img" id="layer-reveal" alt="Reveal House">

            <!-- UI Text -->
            <div class="overlay-content">
                <h1>LIVE IN<br>COLORS</h1>
                <p>เลื่อนลงเพื่อสัมผัสประสบการณ์การเปลี่ยนสี</p>
            </div>
        </div>
    </div>

    <!-- Dummy Section ต่อไป -->
    <div class="next-section">
        <h2>เนื้อหาเวปไซต์ส่วนถัดไป...</h2>
    </div>

    <script>
        const scrollTrack = document.getElementById('scrollTrack');
        const layerReveal = document.getElementById('layer-reveal');

        // ลิงก์รูปภาพที่แปลงเพื่อให้แสดงผลได้โดยตรง (Blue, White, Yellow)
        const randomImages = [
            "https://drive.google.com/uc?export=view&id=1Ha315_mb-8C2A9mW4QU7VNptXF5VO64R", // น้ำเงิน
            "https://drive.google.com/uc?export=view&id=1dWbf2wqS0vzNfSAUgQi4ry3njYsbCODG", // ขาว
            "https://drive.google.com/uc?export=view&id=1vDDyqSmq6pMY12SidO87xMFCX0BO9M1D"  // เหลือง
        ];

        let currentRevealIndex = -1;
        let isAtTop = true;

        // ฟังก์ชันสำหรับสุ่มสีบ้าน
        function setRandomRevealColor() {
            let nextIndex;
            // สุ่มจนกว่าจะไม่ได้สีเดิม (ในกรณีที่เลื่อนขึ้นลงหลายรอบ)
            do {
                nextIndex = Math.floor(Math.random() * randomImages.length);
            } while (nextIndex === currentRevealIndex && randomImages.length > 1);
            
            currentRevealIndex = nextIndex;
            layerReveal.src = randomImages[currentRevealIndex];
        }

        // เซ็ตสีแบบสุ่มตั้งแต่ครั้งแรกที่เปิดเว็บ
        setRandomRevealColor();

        // ดักจับการ Scroll
        window.addEventListener('scroll', () => {
            const trackRect = scrollTrack.getBoundingClientRect();
            
            // คำนวณระยะการ Scroll ภายในพื้นที่ของ scroll-track (จะได้ค่าระหว่าง 0 ถึง 1)
            const maxScrollableHeight = trackRect.height - window.innerHeight;
            let scrollProgress = Math.abs(trackRect.top) / maxScrollableHeight;

            // ป้องกันค่าเกินขอบเขต
            if (scrollProgress < 0) scrollProgress = 0;
            if (scrollProgress > 1) scrollProgress = 1;

            // อัพเดต clip-path (ลดค่า inset ด้านล่างจาก 100% เหลือ 0% ตามการเลื่อน)
            const insetBottom = 100 - (scrollProgress * 100);
            layerReveal.style.clipPath = `inset(0 0 ${insetBottom}% 0)`;

            // ตรรกะเช็คการเลื่อนกลับไปบนสุดเพื่อเปลี่ยนสีบ้านสำหรับรอบหน้า
            if (scrollProgress === 0 && !isAtTop) {
                isAtTop = true;
                setRandomRevealColor(); // สุ่มสีใหม่เมื่อกลับถึงบนสุด
            } else if (scrollProgress > 0) {
                isAtTop = false;
            }
        });
    </script>
</body>
</html>
