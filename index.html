<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP Paint - Hero Section</title>
    <!-- นำเข้าฟอนต์เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #111;
        }

        /* พื้นที่สำหรับ Scroll ให้มีระยะเลื่อน */
        .scroll-track {
            height: 250vh; /* ความยาวของการ Scroll เพื่อให้มีเวลาดูการเปลี่ยนสี */
            position: relative;
        }

        /* Section Hero ที่จะล็อคติดหน้าจอขณะเลื่อน */
        .hero-sticky {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh; /* สูงเต็มจอ */
            overflow: hidden;
            background-color: #000;
        }

        /* จัดการรูปภาพให้อยู่ตรงกลาง */
        .hero-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center; 
        }

        /* เลเยอร์สีฐาน (สีที่จะโผล่ตอนเลื่อนกลับขึ้นไป) */
        #layer-base {
            z-index: 1;
        }

        /* เลเยอร์สีใหม่ที่จะโผล่ตอนเลื่อนลงมา */
        #layer-reveal {
            z-index: 2;
            clip-path: inset(0 0 100% 0); /* เริ่มต้นโดนซ่อน 100% */
            will-change: clip-path;
        }

        /* ข้อความทับบนรูป */
        .overlay-content {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            color: white;
            z-index: 10;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .overlay-content h1 {
            font-size: clamp(3rem, 5vw, 6rem);
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .overlay-content p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* Section เนื้อหาถัดไปของเว็บไซต์ */
        .next-section {
            height: 100vh;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .next-section h2 {
            font-size: 3rem;
        }
    </style>
</head>
<body>

    <div class="scroll-track" id="scrollTrack">
        <div class="hero-sticky">
            
            <!-- เลเยอร์ฐาน (Default เป็นสีแดง) -->
            <img src="_h1_red.png" class="hero-img" id="layer-base" alt="Base House">
            
            <!-- เลเยอร์เติมสี (เลื่อนลงครั้งแรกเป็นสีเหลือง) -->
            <img src="_h1_yellow.png" class="hero-img" id="layer-reveal" alt="Reveal House">

            <!-- UI Text -->
            <div class="overlay-content">
                <h1>LIVE IN<br>COLORS</h1>
                <p>เลื่อนลงเพื่อสัมผัสประสบการณ์การเปลี่ยนสี</p>
            </div>
        </div>
    </div>

    <div class="next-section">
        <h2>เนื้อหาเวปไซต์ส่วนถัดไป...</h2>
    </div>

    <script>
        const scrollTrack = document.getElementById('scrollTrack');
        const layerBase = document.getElementById('layer-base');
        const layerReveal = document.getElementById('layer-reveal');

        // รายชื่อไฟล์ภาพทั้งหมด
        const randomImages = [
            "_h1_Blue.png",
            "_h1_orange.png",
            "_h1_red.png",
            "_h1_sky.png",
            "_h1_white.png",
            "_h1_yellow.png"
        ];

        let isAtTop = true;
        let isAtBottom = false;

        // ฟังก์ชันสุ่มสีใหม่ โดยบังคับว่าต้องไม่ซ้ำกับสีที่กำลังโชว์อยู่
        function getNewColor(currentVisibleColor) {
            let nextColor;
            do {
                const randomIndex = Math.floor(Math.random() * randomImages.length);
                nextColor = randomImages[randomIndex];
            } while (nextColor === currentVisibleColor); // สุ่มใหม่เรื่อยๆ ถ้าได้สีเดิม
            return nextColor;
        }

        window.addEventListener('scroll', () => {
            const trackRect = scrollTrack.getBoundingClientRect();
            const maxScrollableHeight = trackRect.height - window.innerHeight;
            
            let scrollProgress = 0;
            if (trackRect.top < 0) {
                scrollProgress = Math.abs(trackRect.top) / maxScrollableHeight;
            }

            // ปัดเศษให้สุดทาง เพื่อให้ระบบทริกเกอร์เปลี่ยนสีได้ 100% ไม่มีค้าง
            if (scrollProgress < 0.05) scrollProgress = 0;
            if (scrollProgress > 0.95) scrollProgress = 1;

            // ค่อยๆ โชว์เลเยอร์หน้าตามระยะการเลื่อน
            const insetBottom = 100 - (scrollProgress * 100);
            layerReveal.style.clipPath = `inset(0 0 ${insetBottom}% 0)`;

            // ตรรกะแอบสลับสีเลเยอร์ด้านหลัง (ทำงานเมื่อเลื่อนสุดทางเท่านั้น)
            if (scrollProgress === 1) {
                if (!isAtBottom) {
                    isAtBottom = true;
                    // ตอนเลื่อนลงล่างสุด ภาพที่เห็น 100% คือ layerReveal
                    // เราต้องสุ่มสีใหม่ไปใส่ที่ layerBase เพื่อเตรียมไว้โชว์ตอนไถขึ้น!
                    const currentVisible = layerReveal.getAttribute('src');
                    layerBase.src = getNewColor(currentVisible);
                }
            } else if (scrollProgress === 0) {
                if (!isAtTop) {
                    isAtTop = true;
                    // ตอนเลื่อนขึ้นบนสุด ภาพที่เห็น 100% คือ layerBase
                    // เราต้องสุ่มสีใหม่ไปใส่ที่ layerReveal เพื่อเตรียมไว้โชว์ตอนไถลงครั้งต่อไป!
                    const currentVisible = layerBase.getAttribute('src');
                    layerReveal.src = getNewColor(currentVisible);
                }
            } else {
                // ถ้าอยู่ระหว่างทาง (กำลังเปลี่ยนสี) รีเซ็ตสถานะ
                isAtTop = false;
                isAtBottom = false;
            }
        });
    </script>
</body>
</html>
